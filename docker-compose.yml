version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aegisgate-db
    environment:
      POSTGRES_DB: securehealth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securehealth_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: aegisgate-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: securehealth_db
      DB_USER: postgres
      DB_PASSWORD: securehealth_password
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PSEUDO_SALT: ${PSEUDO_SALT}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  pgdata: