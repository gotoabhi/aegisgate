name: AegisGate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securehealth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm install

      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d securehealth_db -f database/schema.sql

      - name: Validate environment configuration
        working-directory: api
        run: |
          cp .env.example .env
          echo "GEMINI_API_KEY=test-key" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=securehealth_db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "AWS_REGION=us-east-1" >> .env
          echo "S3_BUCKET_NAME=test-bucket" >> .env

      - name: Check Node.js syntax
        working-directory: api
        run: node --check src/server.js

      - name: Verify server starts
        working-directory: api
        run: |
          timeout 10s node src/server.js &
          sleep 5
          curl -f http://localhost:5000/api/v1/egress/audit-logs
          kill %1 || true

      - name: Validate database schema integrity
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d securehealth_db -c "\dt"